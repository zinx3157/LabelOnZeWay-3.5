name: LZWay 3.5 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JS dependencies
        run: npm install
      - name: Run application tests
        run: npm test
      - name: Prepare static app
        run: npm run prepare:android
      - name: Create Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LZWay-3.5-UAT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LZWay-3.5-Android-UAT
          path: LZWay-3.5-UAT.apk
          if-no-files-found: error
          retention-days: 30
