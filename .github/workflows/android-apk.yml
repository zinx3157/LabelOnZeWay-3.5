name: LZWay 3.5 Android APK

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JS dependencies
        run: npm install
      - name: Run application tests
        run: npm test
      - name: Prepare static app
        run: npm run prepare:android
      - name: Create Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LZWay-3.5-UAT.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LZWay-3.5-Android-UAT
          path: LZWay-3.5-UAT.apk
          if-no-files-found: error
          retention-days: 30
