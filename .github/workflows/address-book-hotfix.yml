name: Address Book source hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy exact-match action
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/modules/label.js')
          s=p.read_text()
          old="""    useSaved.addEventListener('click', () => {\n      syncFields(item, fields);\n      const match = findCustomerMatch(store.getState().customers, item.contact);\n      if (!match) { showResult('No matching saved customer for this row.', 'warning'); return; }\n      item.contact = { name: match.name || '', phone: match.phone || '', address: match.address || '' };\n      item.status = 'review';\n      redraw();\n    });"""
          new="""    // Address Book selection is handled by batch-customer-picker.js.\n    // Do not run the former exact-match lookup here: an explicit selection is authoritative.\n    useSaved.addEventListener('click', () => {});"""
          if old not in s:
              raise SystemExit('legacy handler not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/modules/label.js
          git commit -m "fix: remove conflicting saved-customer exact match" || exit 0
          git push
