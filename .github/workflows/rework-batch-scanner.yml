name: Rework LabelOnZeWay batch scanner

on:
  push:
    paths:
      - '.github/workflows/rework-batch-scanner.yml'

permissions:
  contents: write

jobs:
  rework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply batch scanner rework
        run: python3 scripts/rework-batch-scanner.py
      - name: Validate
        run: npm test
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/label.js src/styles/workflows.css sw.js
          git commit -m 'feat: rework batch scanner for fast review and bulk processing'
          git push
