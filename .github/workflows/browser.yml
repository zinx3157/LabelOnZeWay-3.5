name: LZWay 3.5 Browser Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Domain and architecture tests
        run: npm test
      - name: Install Playwright 1.63.0
        run: npm install --no-save playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static UAT server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/lz35-http.log 2>&1 &
          echo $! > /tmp/lz35-http.pid
          sleep 2
      - name: Run repeated desktop and phone flows
        run: node tests/browser.mjs
      - name: Run cloud tracking and offline PWA acceptance
        run: node tests/browser-integration.mjs
      - name: Run financial and claims parity acceptance
        run: node tests/browser-parity.mjs
