<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061015">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LZWay 3.5">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./public/icon.svg">
  <link rel="manifest" href="./public/manifest.webmanifest">
  <link rel="stylesheet" href="./src/styles/tokens.css?v=32">
  <link rel="stylesheet" href="./src/styles/app.css?v=32">
  <link rel="stylesheet" href="./src/styles/workflows.css?v=32">
  <link rel="stylesheet" href="./src/styles/batch-customer-picker.css?v=32">
  <link rel="stylesheet" href="./src/styles/thermal-label.css?v=32">
  <link rel="stylesheet" href="./src/styles/audit.css?v=32">
  <title>LabelOnZeWay 3.5</title>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script type="module">
    const VERSION = '32';
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter((key) => key.startsWith('labelonzeway-3.5-shell-')).map((key) => caches.delete(key)));
      }
    } catch (error) {
      console.warn('Cache reset skipped', error);
    }
    await import(`./src/main.js?v=${VERSION}`);
  </script>
</body>
</html>
